name: CI/CD Pipeline — Run The Testing cases

on:
  push:
    branches:
      - main # Runs the workflow on push to the main branch
      - testing
  pull_request:
    branches:
      - main # Runs the workflow on pull request to the main branch

jobs:

  setup:
    name: ⚙️ Setup & Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Run ESLint
        shell: bash
        run: npm run lint


 
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: [setup]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: "testuser"
          POSTGRES_PASSWORD: "testpass"
          POSTGRES_DB: "testdb"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
      PORT: 3000
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      SALT_ROUNDS: ${{ secrets.SALT_ROUNDS }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        shell: bash
        run: npm install

          
      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run seed

      - name: Run tests
        run: npm test